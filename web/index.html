<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ぷよぷよ AI - 手順ビューアー</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-y: auto;
    }
    #app {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    canvas {
      border: 2px solid #444;
      border-radius: 4px;
    }
    #sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 160px;
    }
    .panel {
      background: #16213e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
    }
    .panel h3 {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .panel .value {
      font-size: 24px;
      font-weight: bold;
      color: #e94560;
    }
    #next-canvas,
    #next-next-canvas {
      border: none;
    }
    #controls {
      font-size: 11px;
      color: #666;
      line-height: 1.6;
    }
    #placement-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .placement-btn {
      background: #1a1a2e;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 2px 6px;
      cursor: pointer;
      font-size: 11px;
      font-family: monospace;
    }
    .placement-btn:hover,
    .placement-btn.active {
      background: #e94560;
      color: #fff;
      border-color: #e94560;
    }
    #game-over-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    #game-over-overlay.show {
      display: flex;
    }
    #game-over-box {
      background: #16213e;
      border: 2px solid #e94560;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
    }
    #game-over-box h2 {
      color: #e94560;
      font-size: 32px;
      margin-bottom: 16px;
    }
    #game-over-box p {
      margin-bottom: 8px;
    }
    #game-over-box .restart-hint {
      margin-top: 16px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="board-canvas" width="240" height="560"></canvas>
    <div id="sidebar">
      <div class="panel">
        <h3>NEXT</h3>
        <canvas id="next-canvas" width="80" height="80"></canvas>
      </div>
      <div class="panel">
        <h3>NEXT 2</h3>
        <canvas id="next-next-canvas" width="60" height="60"></canvas>
      </div>
      <div class="panel">
        <h3>スコア</h3>
        <div class="value" id="score-display">0</div>
      </div>
      <div class="panel">
        <h3>最大連鎖</h3>
        <div class="value" id="chain-display">0</div>
      </div>
      <div class="panel">
        <h3>ぷよ数</h3>
        <div class="value" id="pieces-display">0</div>
      </div>
      <div class="panel">
        <h3>ツモ Seed</h3>

        <input
          id="tsumo-seed"
          type="number"
          value="123456"
          min="0"
          max="4294967295"
          step="1"
          style="
            width:100%;
            padding:4px;
            background:#1a1a2e;
            color:#eee;
            border:1px solid #444;
            border-radius:4px;
          "
        >
        <div style="
          font-size:10px;
          color:#888;
          margin-top:4px;
        ">
          変更後 R で反映
        </div>
      </div>
      <div class="panel">
        <h3>AI モード</h3>

        <div style="margin-bottom:8px;">
          <label
            style="font-size:11px;color:#888;display:block;margin-bottom:3px;"
          >
            モデル
          </label>

          <div style="display:flex;gap:4px;">
            <select
              id="ai-model-select"
              style="
                flex:1;
                min-width:0;
                padding:4px;
                background:#1a1a2e;
                color:#eee;
                border:1px solid #444;
                border-radius:4px;
                font-size:11px;
              "
            >
              <option value="puyo_model.bin">
                puyo_model.bin
              </option>
            </select>

            <button
              id="refresh-model-list"
              type="button"
              title="モデル一覧を更新"
              style="
                padding:3px 6px;
                background:#1a1a2e;
                color:#eee;
                border:1px solid #444;
                border-radius:4px;
                cursor:pointer;
              "
            >
              更新
            </button>
          </div>
        </div>

        <select
          id="ai-mode-select"
          style="width:100%;padding:4px;background:#1a1a2e;color:#eee;border:1px solid #444;border-radius:4px;"
        >
          <option value="heuristic">ヒューリスティック</option>
          <option value="nn">ニューラルネット</option>
          <option value="nn-mcts">NN + MCTS</option>
        </select>

        <div
          id="mcts-options"
          style="display:none;margin-top:4px;"
        >
          <label style="font-size:11px;color:#888;">
            シミュレーション数:
            <input
              id="mcts-simulations"
              type="number"
              value="50"
              min="10"
              max="400"
              step="10"
              style="width:60px;padding:2px;background:#1a1a2e;color:#eee;border:1px solid #444;border-radius:4px;"
            >
          </label>
        </div>

        <div
          id="ai-mode-status"
          style="font-size:11px;color:#888;margin-top:4px;"
        ></div>
      </div> 
      <div class="panel" id="ai-eval-panel" style="display:none;">
        <h3>AI評価</h3>
        <div style="font-size:12px;">
          <div>スコア: <span id="ai-score-display" style="color:#e94560;font-weight:bold;">-</span></div>
          <div>最善手: <span id="ai-best-display" style="color:#e94560;font-weight:bold;">-</span></div>
        </div>
      </div>
      <div class="panel">
        <h3>配置一覧</h3>
        <div id="placement-list" style="max-height:200px;overflow-y:auto;font-size:12px;"></div>
      </div>
      <div id="controls" class="panel">
        <h3>操作</h3>
        ← → 移動<br>
        ↑ 回転<br>
        ↓ ドロップ<br>
        Space AI配置 / 確定<br>
        R リスタート
      </div>
    </div>
  </div>
  <div id="game-over-overlay">
    <div id="game-over-box">
      <h2>GAME OVER</h2>
      <p>スコア: <span id="final-score">0</span></p>
      <p>最大連鎖: <span id="final-chain">0</span></p>
      <p class="restart-hint">Rキーでリスタート</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
